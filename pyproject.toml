[project]
name = "edl-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Andres Ingelmo Poveda", email = "aingelmop@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "google-genai==2.23.0",
    "imagehash>=4.3.2",
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "openai>=1.40",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "pyarrow>=25.0.1",
    "python-multipart>=0.0.32",
    "scenedetect>=0.7.1",
    "ultralytics>=8.4.147",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Explicit rule families instead of `select = ["ALL"]` (ruff's own docs advise
# against ALL: it silently pulls in future rules on upgrade). Omitted on purpose:
# CPY (no license headers), FBT (boolean params read fine via keyword args),
# AIR/FAST/DJ (Airflow/FastAPI/Django: unused here).
select = [
    "E", "W", "F",        # pycodestyle, pyflakes
    "I", "N", "UP",        # isort, pep8-naming, pyupgrade
    "D",                   # pydocstyle
    "YTT", "ANN", "ASYNC", "S", "BLE", "B", "A", "COM", "C4",
    "DTZ", "T10", "EM", "EXE", "FIX", "FA", "INT", "ISC", "ICN",
    "LOG", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET",
    "SLF", "SIM", "SLOT", "TID", "TD", "TC", "ARG", "PTH", "FLY",
    "C90", "PD", "NPY", "PERF", "PGH", "PL", "FURB", "RUF", "TRY",
]
ignore = [
    "S603", "S607",  # subprocess with list args (no shell) calling ffmpeg/dpkg by name is fine
    "PLC0415",  # intentional lazy imports (optional/slow deps: torch, pandas, librosa, genai)
    "PLR2004",  # numeric domain constants (fps, pixel bounds, thresholds) read fine inline
    "PLR0912", "PLR0913", "PLR0915", "PLR0917", "C901",  # complexity metrics too strict for this domain
    "COM812",  # conflicts with the formatter (ruff's own recommendation)
    "D100", "D104", "D105", "D107",  # module/package/dunder/__init__ docstrings add no info here
    "D203", "D213",  # conflict with D211/D212 (formatter-compatible blank-line placement)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "ANN001", "ANN201", "ANN202", "ANN204", "ANN003", "INP001", "PT006", "PT011", "PT018", "ARG001", "ARG005", "ANN401", "D", "SLF001"]
"scripts/**" = ["T201", "INP001", "S101", "S311", "E402", "D", "BLE001", "E501"]
"tools/**" = ["T201", "INP001", "S101", "S311", "E402", "D", "BLE001", "E501", "ANN", "SIM105", "S110", "A"]
"src/edl_agent/web/**" = ["B008"]  # FastAPI's Form(...)/Depends(...) idiom

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["tools"]
