[project]
name = "edl-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Andres Ingelmo Poveda", email = "aingelmop@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai==2.23.0",
    "imagehash>=4.3.2",
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "pyarrow>=25.0.1",
    "scenedetect>=0.7.1",
    "ultralytics>=8.4.147",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213"]

[tool.ty.environment]
python-version = "3.14"
