# Builds the linux/arm64 deploy image and publishes it to GHCR, where the
# homelab wrapper (apps/edl-agent) pulls it for the OCI Ampere A1 VM.
# Native ARM runner (no qemu): dependency install + ffmpeg fetch run at
# full speed. Triggered on main pushes touching the image inputs, or
# manually via workflow_dispatch.

name: docker-arm64

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "scripts/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest-linuxarm64-gpl
            type=sha,prefix=,suffix=-linuxarm64-gpl,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry (not GHA) cache: the image is multi-GB and would
          # thrash the 10 GB shared GHA cache budget + LRU itself away.
          # mode=max caches intermediate stages (the locked-deps layer
          # is what makes src-only pushes fast).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          # The homelab consumes no attestations; skip the extra
          # manifest push + compute per build.
          provenance: "false"
          sbom: "false"

  # Cold-boot the just-pushed image on native ARM and prove the
  # homelab container contract (port, /health, EDL_AGENT_VAR, UID,
  # TZ, headless cv2, CPU torch, GPL ffmpeg) plus report the
  # uncompressed size and RSS the deploy manifest is sized against.
  verify:
    needs: build-push
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pinned image ref
        run: |
          echo "REF=ghcr.io/${{ github.repository }}:${GITHUB_SHA:0:7}-linuxarm64-gpl" >> "$GITHUB_ENV"

      - name: Pull pinned image and report uncompressed size
        run: |
          docker pull "$REF"
          SIZE="$(docker image inspect --format '{{.Size}}' "$REF")"
          python3 -c "print(f'uncompressed: ${SIZE} bytes = {${SIZE}/1e9:.2f} GB')"

      - name: Cold run and probe GET /health (120s budget)
        run: |
          set -eux
          mkdir -p /tmp/x && sudo chown 1000:1000 /tmp/x
          docker run -d --platform linux/arm64 --name edl \
            -p 8000:8000 \
            -e EDL_AGENT_VAR=/tmp/x -v /tmp/x:/tmp/x \
            -e TZ=Pacific/Auckland \
            "$REF"
          for _ in $(seq 1 24); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Contract checks inside the running container
        run: |
          set -eux
          VENV=/app/.venv/bin/python
          test "$(docker exec edl id -u)" = 1000
          docker exec edl "$VENV" -c "import cv2; print(cv2.__version__)"
          docker exec edl "$VENV" -c "import torch; assert not torch.cuda.is_available(); print(torch.__version__)"
          docker exec edl "$VENV" -c "from edl_agent.paths import VAR; assert str(VAR) == '/tmp/x', VAR"
          docker exec edl ffmpeg -hide_banner -buildconf | grep -i -E "gpl|aarch64"
          docker exec edl date +%Z | grep -iE 'nz(st|dt)'
          docker exec edl cat /proc/1/status | grep -E 'VmHWM|VmRSS'

      - name: PORT env is honored
        run: |
          set -eux
          docker run -d --platform linux/arm64 --name edl-port \
            -p 8001:8001 -e PORT=8001 "$REF"
          for _ in $(seq 1 12); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8001/health

      - name: Cleanup
        if: always()
        run: docker rm -f edl edl-port || true
