{% extends "base.html" %}
{% block content %}
  <h2>New session</h2>
  {% if error %}
    <p class="status-failed">{{ error }}</p>
  {% endif %}
  <form action="/sessions" method="post" enctype="multipart/form-data">
    <label>Session name
      <input type="text" name="name" required pattern="[A-Za-z0-9_-]+">
    </label>
    <label>Clips / photos
      <input type="file" name="clips" multiple required>
    </label>
    <label>Music track (mp3, wav, or mp4/m4a)
      <input
        type="file"
        name="music"
        accept="audio/mpeg,audio/wav,audio/x-wav,audio/mp4,video/mp4"
        required
      >
    </label>
    <label>LLM provider
      <select name="provider" id="provider">
        {% for p in providers %}
        <option value="{{ p }}">{{ p }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Model
      <input type="text" name="model" id="model">
    </label>
    <label>Theme
      <select name="theme">
        <option value="training">training (CrossFit / Hyrox / funcional)</option>
        <option value="yoga">yoga</option>
      </select>
    </label>
    <label>Hook text (manual, skips the LLM)
      <input type="text" name="hook_line" maxlength="40" placeholder="La barra despega del suelo">
    </label>
    <fieldset>
      <legend>Brand (optional; no logo = no watermark / end card)</legend>
      <label>Logo (PNG with alpha)
        <input type="file" name="logo" accept="image/png">
      </label>
      <label>Handle
        <input type="text" name="handle" maxlength="40" placeholder="@migimnasio">
      </label>
      <label>Second line
        <input type="text" name="line" maxlength="60" placeholder="C/ Toro 12 · Salamanca">
      </label>
    </fieldset>
    <p><button type="submit">Start run</button></p>
    <p id="upload-status"></p>
  </form>
  <script>
    const defaultModels = {{ default_models | tojson }};
    const providerSelect = document.getElementById("provider");
    const modelInput = document.getElementById("model");
    function syncModel() { modelInput.value = defaultModels[providerSelect.value] || ""; }
    providerSelect.addEventListener("change", syncModel);
    syncModel();

    const form = document.querySelector("form");
    const submitButton = form.querySelector("button[type=submit]");
    const status = document.getElementById("upload-status");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      status.textContent = "Uploading...";
      const xhr = new XMLHttpRequest();
      xhr.open("POST", form.action);
      xhr.upload.addEventListener("progress", (e) => {
        if (!e.lengthComputable) return;
        const mb = (n) => (n / 1e6).toFixed(1);
        const pct = Math.round((e.loaded / e.total) * 100);
        status.textContent = `Uploading: ${mb(e.loaded)} / ${mb(e.total)} MB (${pct}%)`;
      });
      xhr.upload.addEventListener("load", () => {
        status.textContent = "Upload complete, saving session and launching pipeline...";
      });
      xhr.addEventListener("load", () => {
        if (xhr.responseURL) {
          window.location = xhr.responseURL;
        } else {
          status.textContent = `Failed: HTTP ${xhr.status}`;
          submitButton.disabled = false;
        }
      });
      xhr.addEventListener("error", () => {
        status.textContent = "Upload failed (network error).";
        submitButton.disabled = false;
      });
      xhr.send(new FormData(form));
    });
  </script>
{% endblock %}
